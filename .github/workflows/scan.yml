name: Daily MMXM Scan

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Run Scanner and Sync to JSONBin
        env:
          PYTHONPATH: ${{ github.workspace }}/forex-chart-scan
        run: |
          python forex-chart-scan/scripts/sync_to_jsonbin.py --timeframe 1D
