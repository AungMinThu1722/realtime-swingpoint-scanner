<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMXM | Vision Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Geist', 'sans-serif'],
                        mono: ['Geist Mono', 'monospace']
                    },
                    colors: {
                        oled: '#000000',
                        accent: '#D97706', // Claude Orange
                        'accent-dark': '#B45309'
                    }
                }
            }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .light .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D9770644; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .mono-label { font-family: 'Geist Mono', monospace; letter-spacing: 0.05em; }
        .tab-active { color: #D97706; border-bottom: 2px solid #D97706; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-oled text-slate-900 dark:text-slate-200 transition-colors duration-500 min-h-screen selection:bg-accent/30 font-sans">

    <!-- Nav -->
    <nav class="fixed top-0 w-full z-50 px-8 py-5 flex justify-between items-center glass border-b border-white/5">
        <div class="flex items-center gap-4">
            <div class="w-9 h-9 bg-accent rounded-lg flex items-center justify-center shadow-lg shadow-accent/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <span class="text-xl font-bold tracking-tight mono-label uppercase">MMXM <span class="text-accent">Scanner</span></span>
        </div>
        
        <button onclick="toggleTheme()" class="p-2.5 rounded-xl glass hover:bg-accent/10 transition-all duration-300 group">
            <svg id="sun-icon" class="hidden w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
            <svg id="moon-icon" class="w-5 h-5 text-slate-500 group-hover:text-accent" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </nav>

    <main class="max-w-6xl mx-auto pt-36 pb-20 px-8">
        <header class="mb-12 flex flex-col md:flex-row justify-between items-end gap-10">
            <div class="space-y-4 max-w-2xl fade-in">
                <div class="inline-flex items-center gap-2.5 px-3 py-1 rounded-full bg-accent/10 text-accent text-[9px] font-black uppercase tracking-[0.2em] border border-accent/20">
                    <span class="w-1.5 h-1.5 bg-accent rounded-full animate-pulse"></span>
                    Terminal Active
                </div>
                <h1 class="text-4xl md:text-6xl font-bold tracking-tighter">Market <span class="text-accent italic font-light">Intelligence</span></h1>
                <p class="text-slate-500 dark:text-slate-400 text-base font-medium leading-relaxed">
                    Vectorized ICT detection protocol analyzing global liquidity pools.
                </p>
            </div>
            
            <div class="flex gap-4 fade-in">
                <div class="glass p-6 rounded-3xl min-w-[180px] border-l-4 border-l-accent shadow-xl shadow-accent/5">
                    <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-2">Sync Timer</p>
                    <p id="update-timer" class="text-2xl font-bold mono-label text-accent italic">60s</p>
                </div>
            </div>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex gap-8 mb-8 border-b border-white/5 px-4 fade-in" style="animation-delay: 0.1s">
            <button id="tab-1D" onclick="switchTab('1D')" class="pb-3 text-xs font-black uppercase tracking-widest tab-active transition-all">Daily Scan</button>
            <button id="tab-1W" onclick="switchTab('1W')" class="pb-3 text-xs font-black uppercase tracking-widest text-slate-500 hover:text-accent transition-all">Weekly Scan</button>
        </div>

        <!-- Feed Container -->
        <div class="fade-in" style="animation-delay: 0.2s">
            <div class="glass rounded-[40px] overflow-hidden shadow-2xl">
                <div class="px-10 py-7 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
                    <div class="flex items-center gap-4">
                        <div class="w-2 h-2 bg-accent rounded-full animate-ping"></div>
                        <h2 id="view-title" class="text-lg font-bold mono-label uppercase">Daily Signals</h2>
                    </div>
                    <div id="status-chip" class="px-4 py-1.5 rounded-xl bg-accent/5 text-accent text-[8px] font-black tracking-[0.2em] uppercase border border-accent/10">
                        Stream Online
                    </div>
                </div>

                <div class="overflow-x-auto px-4 py-4">
                    <table class="w-full">
                        <thead>
                            <tr class="text-slate-500 text-[9px] font-black uppercase tracking-[0.3em]">
                                <th class="px-8 py-6 text-left">Instrument</th>
                                <th class="px-8 py-6 text-center">Interval</th>
                                <th class="px-8 py-6 text-right">Detection Profile</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-white/5">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer class="mt-20 pt-10 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-10 px-4 opacity-50">
            <p id="last-updated" class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em]">Syncing...</p>
            <div class="text-[9px] font-black tracking-widest uppercase text-slate-500 italic">Alpha Build v3.2</div>
        </footer>
    </main>

    <script>
        const BIN_ID = "69d9d5f9aaba882197e809b7";
        const API_KEY = "$2a$10$BxfPEZZ3z3.3Cz6dvMCtxeR19LBBAzGJGO5q7MI.kHV5IlFx/sb/G";

        let allData = {};
        let currentTab = "1D";

        function toggleTheme() {
            const html = document.documentElement;
            const moon = document.getElementById('moon-icon');
            const sun = document.getElementById('sun-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                moon.classList.add('hidden');
                sun.classList.remove('hidden');
                localStorage.theme = 'light';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
                localStorage.theme = 'dark';
            }
        }

        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.getElementById('moon-icon').classList.add('hidden');
            document.getElementById('sun-icon').classList.remove('hidden');
        }

        async function loadData() {
            const chip = document.getElementById('status-chip');
            try {
                chip.innerText = "Syncing...";
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                allData = data.record; // Expected structure: {"1D": [...], "1W": [...], "updated_at": "..."}
                
                renderTable(currentTab);
                
                if (allData.updated_at) {
                    document.getElementById('last-updated').innerText = "Last Sync: " + allData.updated_at;
                }
                chip.innerText = "Stream Online";
            } catch (error) {
                console.error('Sync Error:', error);
                chip.innerText = "Sync Failed";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // UI Updates
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('tab-active', 'text-accent'));
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.add('text-slate-500'));
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('tab-active', 'text-accent');
            activeBtn.classList.remove('text-slate-500');
            
            document.getElementById('view-title').innerText = tab === "1D" ? "Daily Signals" : "Weekly Signals";
            
            renderTable(tab);
        }

        function renderTable(tab) {
            const tbody = document.getElementById('table-body');
            const records = allData[tab] || [];
            
            tbody.innerHTML = ""; 

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-10 py-24 text-center text-slate-500 font-bold text-[10px] tracking-widest uppercase">Neutral Market: No ${tab} Patterns</td></tr>`;
                return;
            }

            records.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-accent/[0.03] transition-all duration-300 group border-white/5";
                tr.style.opacity = "0";
                tr.style.transform = "translateY(6px)";
                
                tr.innerHTML = `
                    <td class="px-8 py-7">
                        <div class="flex items-center gap-5">
                            <div class="w-1 h-1 bg-accent/40 group-hover:bg-accent group-hover:scale-150 transition-all rounded-full"></div>
                            <span class="text-xl font-bold mono-label group-hover:text-accent transition-colors tracking-tighter">${row.pair || '-'}</span>
                        </div>
                    </td>
                    <td class="px-8 py-7 text-center">
                        <span class="bg-accent/5 border border-accent/10 text-accent text-[8px] px-4 py-1.5 rounded-lg font-black uppercase tracking-[0.2em]">
                            ${row.timeframe || '-'}
                        </span>
                    </td>
                    <td class="px-8 py-7 text-right">
                        <div class="flex flex-col items-end">
                            <span class="text-accent text-sm font-bold italic tracking-tight uppercase">
                                ${row.status || '-'}
                            </span>
                            <span class="text-[7px] text-slate-500 font-black mt-1 uppercase tracking-widest italic">Institutional Pulse</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
                
                setTimeout(() => {
                    tr.style.opacity = "1";
                    tr.style.transform = "translateY(0)";
                }, 40 * index);
            });
        }

        loadData();
        setInterval(loadData, 60000);

        let timeLeft = 60;
        setInterval(() => {
            timeLeft = timeLeft <= 1 ? 60 : timeLeft - 1;
            document.getElementById('update-timer').innerText = `${timeLeft}s`;
        }, 1000);
    </script>
</body>
</html>
